<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>KJDS Browser Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <span>K</span>
      <div><strong>KJDS</strong><small>VISIBLE PAGE CAPTURE</small></div>
    </header>
    <main>
      <h1>采集商品、SKU 或候选页</h1>
      <p>商品页逐一读取同页 SKU/规格/价格/公开指数；搜索或店铺页采集最多 50 个当前页候选。缺失身份不会猜测。</p>
      <button id="capture" type="button">采集并打开 KJDS 预检</button>
      <button id="search-similar" type="button">按当前商品搜索同类货源</button>
      <output id="status" aria-live="polite">等待你的显式操作</output>
    </main>
    <footer>公开数据进入 ERP 暂存，不是 Supplier Offer、实际成本或正式销量。</footer>
    <script src="popup.js"></script>
  </body>
</html>
