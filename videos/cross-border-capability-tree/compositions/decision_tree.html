    <script>
      (function () {
        const SVG_NS = "http://www.w3.org/2000/svg";
        const root = { x: 960, y: 112, h: 108 };
        const branches = [
          {
            id: "linkfox-parity",
            x: 460,
            y: 292,
            w: 610,
            h: 92,
            label: "LinkFox 同功能覆盖",
            range: "01–05",
            count: 65,
            color: "#B8EF65",
            kicker: "FUNCTIONAL PARITY + GOVERNED AI",
          },
          {

            w: 430,
            h: 92,
            label: "Russia / Ozon 真实运营",

          {

            w: 430,
            h: 92,
            label: "全球治理适配",
            range: "07 + 10",
            count: 34,
            color: "#6E8CFF",
            kicker: "PORTABLE CONTROL PLANE",
          },
        ];
        const domains = [
          {
            id: "01",
            x: 120,
            label: "资产中枢",
            count: 14,
            branch: "linkfox-parity",
            color: "#B8EF65",
          },
          {
            id: "02",
            x: 290,
            label: "服装视觉",
            count: 9,
            branch: "linkfox-parity",
            color: "#B8EF65",
          },
          {
            id: "03",
            x: 460,
            label: "商品视觉",
            count: 9,
            branch: "linkfox-parity",
            color: "#B8EF65",
          },
          {
            id: "04",
            x: 630,
            label: "修图质控",
            count: 14,
            branch: "linkfox-parity",
            color: "#B8EF65",
          },
          {
            id: "05",
            x: 800,
            label: "视频/POD/设计",
            count: 19,
            branch: "linkfox-parity",
            color: "#B8EF65",
          },
          {
            id: "06",
            x: 950,
            label: "批量与企业",
            count: 11,
            branch: "russia-ozon",
            color: "#FFB760",
          },
          {
            id: "08",
            x: 1120,
            label: "市场/Listing",
            count: 8,
            branch: "russia-ozon",
            color: "#FFB760",
          },
          {
            id: "09",
            x: 1290,
            label: "供应链/利润/增长",
            count: 25,
            branch: "russia-ozon",
            color: "#FFB760",
          },
          {
            id: "07",
            x: 1540,
            label: "Agent/Skills",
            count: 15,
            branch: "global-governance",
            color: "#6E8CFF",
          },
          {
            id: "10",
            x: 1750,
            label: "Evidence/全球",
            count: 19,
            branch: "global-governance",
            color: "#6E8CFF",
          },
        ];

        const capabilityTotal = domains.reduce((sum, domain) => sum + domain.count, 0);
        const branchTotal = branches.reduce((sum, branch) => sum + branch.count, 0);
        if (domains.length !== 10 || capabilityTotal !== 143 || branchTotal !== 143) {
          throw new Error("KJDS operating-graph contract must remain 10 domains / 143 atomic points.");
        }

        const branchLayer = document.querySelector("#kct-branch-layer");
        const domainLayer = document.querySelector("#kct-domain-layer");
        const leafLayer = document.querySelector("#kct-leaf-layer");
        const trunkLayer = document.querySelector("#kct-trunk-layer");
        const domainEdgeLayer = document.querySelector("#kct-domain-edge-layer");
        const leafEdgeLayer = document.querySelector("#kct-leaf-edge-layer");
        const sweepLayer = document.querySelector("#kct-sweep-layer");

        const createPath = ({ id, className, d, color, parent }) => {
          const path = document.createElementNS(SVG_NS, "path");
          path.setAttribute("id", id);
          path.setAttribute("class", className);
          path.setAttribute("d", d);
          path.setAttribute("stroke", color);
          parent.appendChild(path);
          return path;
        };

        branches.forEach((branch) => {
          const anchor = document.createElement("div");
          anchor.id = `kct-branch-${branch.id}`;
          anchor.className = "kct-node-anchor kct-branch";
          anchor.style.left = `${branch.x}px`;
          anchor.style.top = `${branch.y}px`;
          anchor.style.width = `${branch.w}px`;
          anchor.style.setProperty("--branch-color", branch.color);
          anchor.innerHTML = `
            <div class="kct-node-shell">
              <span class="kct-branch-accent"></span>
              <div class="kct-branch-kicker">${branch.kicker}</div>
              <div class="kct-branch-title">${branch.label}</div>
              <div class="kct-branch-subtitle">
                <span>${branch.range}</span>
                <span>·</span>
                <span id="kct-branch-count-${branch.id}" class="kct-branch-count">${branch.count}</span>
                <span>原子点</span>
              </div>
            </div>`;
          branchLayer.appendChild(anchor);

          const rootBottom = root.y + root.h / 2;
          const branchTop = branch.y - branch.h / 2;
          const midY = rootBottom + (branchTop - rootBottom) * 0.48;
          const d = `M ${root.x} ${rootBottom} C ${root.x} ${midY}, ${branch.x} ${midY}, ${branch.x} ${branchTop}`;
          createPath({
            id: `kct-trunk-${branch.id.replace("-parity", "").replace("-ozon", "").replace("-governance", "")}`,
            className: "kct-connector kct-trunk",
            d,
            color: branch.color,
            parent: trunkLayer,
          });
          createPath({
            id: `kct-sweep-${branch.id}`,
            className: "kct-sweep",
            d,
            color: branch.color,
            parent: sweepLayer,
          });
        });

        const leafNodesByDomain = {};
        const leafEdgesByDomain = {};
        domains.forEach((domain) => {
          const branch = branches.find((item) => item.id === domain.branch);
          const anchor = document.createElement("div");
          anchor.id = `kct-domain-${domain.id}`;
          anchor.className = "kct-node-anchor kct-domain";
          anchor.style.left = `${domain.x}px`;
          anchor.style.top = "508px";
          anchor.style.setProperty("--domain-color", domain.color);
          anchor.innerHTML = `
            <div class="kct-node-shell">
              <div class="kct-domain-topline">
                <span class="kct-domain-id">DOMAIN ${domain.id}</span>
                <span id="kct-domain-badge-${domain.id}" class="kct-domain-badge">0</span>
              </div>
              <div class="kct-domain-title">${domain.label}</div>
            </div>`;
          domainLayer.appendChild(anchor);

          const branchBottom = branch.y + branch.h / 2;
          const domainTop = 508 - 41;
          const midY = branchBottom + (domainTop - branchBottom) * 0.54;
          createPath({
            id: `kct-domain-edge-${domain.id}`,
            className: `kct-connector kct-domain-edge kct-domain-edge-${branch.id}`,
            d: `M ${branch.x} ${branchBottom} C ${branch.x} ${midY}, ${domain.x} ${midY}, ${domain.x} ${domainTop}`,
            color: domain.color,
            parent: domainEdgeLayer,
          });

          leafNodesByDomain[domain.id] = [];
          leafEdgesByDomain[domain.id] = [];
          const columnGap = 22;
          const rowGap = 26;
          const columnCount = 5;
          for (let leafIndex = 0; leafIndex < domain.count; leafIndex += 1) {
            const column = (leafIndex % columnCount) - 2;
            const row = Math.floor(leafIndex / columnCount);
            const leafX = domain.x + column * columnGap;
            const leafY = 624 + row * rowGap;
            const leafAnchor = document.createElement("div");
            leafAnchor.id = `kct-leaf-${domain.id}-${String(leafIndex + 1).padStart(2, "0")}`;
            leafAnchor.className = "kct-leaf-anchor";
            leafAnchor.style.left = `${leafX}px`;
            leafAnchor.style.top = `${leafY}px`;
            leafAnchor.style.setProperty("--leaf-color", domain.color);
            leafAnchor.setAttribute(
              "aria-label",
              `${domain.label}能力 ${leafIndex + 1}/${domain.count}`,
            );
            leafAnchor.innerHTML = '<span class="kct-leaf-core"></span>';
            leafLayer.appendChild(leafAnchor);
            leafNodesByDomain[domain.id].push(leafAnchor.querySelector(".kct-leaf-core"));

            const domainBottom = 508 + 41;
            const elbowY = 582 + row * 4;
            const edge = createPath({
              id: `kct-leaf-edge-${domain.id}-${String(leafIndex + 1).padStart(2, "0")}`,
              className: `kct-connector kct-leaf-edge kct-leaf-edge-domain-${domain.id}`,
              d: `M ${domain.x} ${domainBottom} L ${domain.x} ${elbowY} L ${leafX} ${elbowY} L ${leafX} ${leafY - 8}`,
              color: domain.color,
              parent: leafEdgeLayer,
            });
            leafEdgesByDomain[domain.id].push(edge);
          }
        });

        const drawPaths = (paths) => {
          paths.forEach((path) => {
            const length = path.getTotalLength();
            path.style.strokeDasharray = `${length}`;
            path.style.strokeDashoffset = `${length}`;
          });
        };
        drawPaths(Array.from(document.querySelectorAll(".kct-connector, .kct-sweep")));

        const timeline = gsap.timeline({ paused: true });
        const rootShell = document.querySelector("#kct-root-node .kct-node-shell");
        const rootHalo = document.querySelector("#kct-root-halo");
        const russiaHalo = document.querySelector("#kct-russia-halo");

        timeline.fromTo(
          rootShell,
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
          0,
        );
        timeline.fromTo(
          rootHalo,
          { opacity: 0, scale: 0.92 },
          { opacity: 0.28, scale: 1.03, duration: 0.35, ease: "power2.out" },
          0,
        );
        timeline.to(rootHalo, { opacity: 0.11, scale: 1, duration: 0.4, ease: "power2.out" }, 0.35);

        const trunkStarts = [0.55, 0.63, 0.71];
        branches.forEach((branch, index) => {
          const trunkId = branch.id.replace("-parity", "").replace("-ozon", "").replace("-governance", "");
          timeline.to(
            `#kct-trunk-${trunkId}`,
            { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" },
            trunkStarts[index],
          );
          timeline.fromTo(
            `#kct-branch-${branch.id} .kct-node-shell`,
            { opacity: 0, scale: 0.92 },
            { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" },
            trunkStarts[index] + 0.38,
          );
          timeline.fromTo(
            `#kct-branch-count-${branch.id}`,
            { scale: 0.92 },
            { scale: 1.04, duration: 0.16, ease: "power2.out" },
            trunkStarts[index] + 0.45,
          );
          timeline.to(
            `#kct-branch-count-${branch.id}`,
            { scale: 1, duration: 0.2, ease: "power2.out" },
            trunkStarts[index] + 0.61,
          );
        });

        const domainStarts = {
          "01": 1.35,
          "02": 1.43,
          "03": 1.51,
          "04": 1.59,
          "05": 1.67,
          "06": 2.45,
          "08": 2.55,
          "09": 2.65,
          "07": 3.05,
          "10": 3.17,
        };
        domains.forEach((domain) => {
          const start = domainStarts[domain.id];
          timeline.to(
            `#kct-domain-edge-${domain.id}`,
            { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
            start,
          );
          timeline.fromTo(
            `#kct-domain-${domain.id} .kct-node-shell`,
            { opacity: 0, scale: 0.92 },
            { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
            start + 0.34,
          );
        });

        const leafWaves = [
          ["01", "02"],
          ["03", "04"],
          ["05", "06"],
          ["08", "09"],
          ["07", "10"],
        ];
        const domainById = Object.fromEntries(domains.map((domain) => [domain.id, domain]));
        leafWaves.forEach((wave, waveIndex) => {
          const waveStart = 3.55 + waveIndex * 0.36;
          wave.forEach((domainId, domainIndex) => {
            const localStart = waveStart + domainIndex * 0.06;
            const badgeState = { value: 0 };
            timeline.to(
              leafEdgesByDomain[domainId],
              {
                strokeDashoffset: 0,
                duration: 0.38,
                ease: "none",
                stagger: 0.02,
              },
              localStart,
            );
            timeline.fromTo(
              leafNodesByDomain[domainId],
              { opacity: 0, scale: 0.55 },
              {
                opacity: 1,
                scale: 1,
                duration: 0.28,
                ease: "power3.out",
                stagger: 0.04,
              },
              localStart + 0.22,
            );
            timeline.to(
              badgeState,
              {
                value: domainById[domainId].count,
                duration: 0.42,
                ease: "power2.out",
                onUpdate: function () {
                  const badge = document.getElementById("kct-domain-badge-" + domainId);
                  badge.textContent = String(Math.round(badgeState.value));
                },
              },
              localStart + 0.2,
            );
            timeline.fromTo(
              `#kct-domain-badge-${domainId}`,
              { scale: 0.92 },
              { scale: 1.04, duration: 0.2, ease: "power2.out" },
              localStart + 0.34,
            );
            timeline.to(
              `#kct-domain-badge-${domainId}`,
              { scale: 1, duration: 0.18, ease: "power2.out" },
              localStart + 0.54,
            );
          });
        });

        const totalState = { value: 0 };
        timeline.to(
          totalState,
          {
            value: 143,
            duration: 0.8,
            ease: "power2.out",
            onUpdate: function () {
              document.querySelector("#kct-root-counter").textContent = String(
                Math.round(totalState.value),
              );
            },
          },
          5.55,
        );
        timeline.fromTo(
          "#kct-root-counter",
          { scale: 0.92 },
          { scale: 1.04, duration: 0.42, ease: "power2.out" },
          5.55,
        );
        timeline.to(
          "#kct-root-counter",
          { scale: 1, duration: 0.38, ease: "power2.out" },
          5.97,
        );
        timeline.to(
          "#kct-root-domain-label",
          { opacity: 1, duration: 0.35, ease: "power2.out" },
          6.05,
        );
        timeline.fromTo(
          russiaHalo,
          { opacity: 0, scale: 0.96 },
          { opacity: 0.28, scale: 1.02, duration: 0.45, ease: "power2.out" },
          5.9,
        );
        timeline.to(
          russiaHalo,
          { opacity: 0.11, scale: 1, duration: 0.5, ease: "power2.out" },
          6.36,
        );

        branches.forEach((branch, index) => {
          timeline.to(
            `#kct-sweep-${branch.id}`,
            {
              opacity: 0.42,
              strokeDashoffset: 0,
              duration: 0.52,
              ease: "power2.out",
            },
            6.55 + index * 0.12,
          );
          timeline.to(
            `#kct-sweep-${branch.id}`,
            { opacity: 0, duration: 0.28, ease: "power2.out" },
            7.07 + index * 0.12,
          );
        });

        timeline.to(
          "#kct-tree-glow",
          { opacity: 0.15, duration: 0.5, ease: "power2.out" },
          7.15,
        );
        timeline.fromTo(
          "#kct-footer",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          7.55,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["decision-tree"] = timeline;
        timeline.seek(0);
      })();
    </script>
  </div>
</template>
