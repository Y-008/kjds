<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>KJDS AI 跨境能力树</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Microsoft YaHei UI";
        src: local("Microsoft YaHei UI");
      }

      @font-face {
        font-family: "PingFang SC";
        src: local("PingFang SC");
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07120f;
        font-family: "Noto Sans JP", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="decision-tree"
        class="clip"
        data-composition-id="decision-tree"
        data-composition-src="compositions/decision_tree.html"
        data-start="0"
        data-duration="8.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTimeline = gsap.timeline({ paused: true });
      window.__timelines.main = mainTimeline;
      mainTimeline.seek(0);
    </script>
  </body>
</html>
