[project]
name = "kjds-control-plane"
version = "0.1.0"
description = "AI-native cross-border commerce control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
