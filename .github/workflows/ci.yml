name: CI

on:
  pull_request:
    branches: [main, integration/pony-full-20260807]
  push:
    branches: [main, integration/pony-full-20260807]

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    env:
      KJDS_REPOSITORY: memory
      KJDS_STRATEGIC_BENCHMARK_SEALING_KEY: "0123456789abcdef0123456789abcdef"
      KJDS_API_KEY: "ci-test-key"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run python scripts/verify_secrets.py
      - run: uv run python scripts/validate_write_paths.py
      - run: pwsh -File ./scripts/verify-fast.ps1

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --webpack

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hermes
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Verify one migration head
        run: test "$(uv run python -m alembic heads | grep -c '(head)')" -eq 1
      - name: Bootstrap disposable G-1 PostgreSQL resources
        run: bash scripts/ci-postgres-bootstrap.sh
      - run: uv run python -m alembic upgrade head
      - run: uv run python scripts/manage_g1_database.py grant-runtime
      - name: Verify media connector PostgreSQL contracts
        run: >-
          uv run pytest -q -p no:cacheprovider
          --basetemp=.runtime/pytest-media-connectors-postgres
          tests/test_media_connectors_postgres.py
      - name: Prepare PostgreSQL API contract basetemp
        run: mkdir -p .runtime/pytest-api-contracts-postgres
      - name: Verify PostgreSQL API contract suites
        run: >-
          uv run pytest -q -p no:cacheprovider
          --basetemp=.runtime/pytest-api-contracts-postgres
          tests/test_api_contract.py
          tests/test_catalog_read_run_handoff.py
          tests/test_channel_accounts_api.py
          tests/test_intelligence_ingestion.py
          tests/test_native_parity_acceptance_api.py
          tests/test_scoped_batch_opportunity.py
          tests/test_scoped_marketplace_catalog.py
          tests/test_scoped_read_only_pilots.py
      - name: Verify API readiness
        shell: bash
        run: |
          .venv/bin/python -m uvicorn apps.control_plane.api:app --host 127.0.0.1 --port 8000 > /tmp/kjds-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kjds-api.log
          exit 1
